# Manual-only publication. No push/PR event can publish this site.
name: Publish Matchwork to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchwork-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build repository-subpath assets
        run: npm run build
        env:
          MATCHWORK_PAGES: 'true'

      - name: Verify Pages build output
        run: node scripts/verifyPagesBuild.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
