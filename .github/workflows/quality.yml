
name: Matchwork Quality Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Lint and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify synthetic generator
        run: node scripts/verifyGenerator.mjs

      - name: Verify statistics engine
        run: node scripts/verifyStats.mjs

      - name: Verify match replay
        run: node scripts/verifyReplay.mjs

      - name: Verify integration
        run: node scripts/verifyIntegration.mjs
