
name: Matchwork Quality Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Lint and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Python backend dependencies
        run: python3 -m pip install -r backend/requirements.txt

      - name: Export canonical synthetic replay data
        run: node scripts/exportReplay.mjs

      - name: Verify Foundry request-budget safeguards
        run: python3 -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Verify real Agent Framework imports and construction (offline)
        run: |
          AZURE_OPENAI_BASE_URL=https://demo.openai.azure.com/openai/v1/ \
          AZURE_OPENAI_API_KEY=ci-placeholder-not-a-secret \
          AZURE_OPENAI_DEPLOYMENT=ci-model \
          python3 -m backend.diagnose_agents

      - name: Evaluate agent evidence and resilience without Azure calls
        run: python3 -m backend.evaluate_agents

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify synthetic generator
        run: node scripts/verifyGenerator.mjs

      - name: Verify statistics engine
        run: node scripts/verifyStats.mjs

      - name: Verify match replay
        run: node scripts/verifyReplay.mjs

      - name: Verify integration
        run: node scripts/verifyIntegration.mjs

      - name: Verify Phase 3 intelligence
        run: node scripts/verifyIntelligence.mjs

      # Disposable CI-only install; no package manifests or lockfile changes.
      - name: Install pinned ONNX Runtime Web for smoke test
        run: npm install --no-save --package-lock=false onnxruntime-web@1.23.2

      - name: Verify actual ONNX WASM inference
        run: node scripts/verifyOnnxRuntime.mjs

      - name: Verify reproducible synthetic ONNX training
        run: |
          python3 scripts/train_match_state.py
          git diff --exit-code -- src/ai/model.ts

      - name: Build GitHub Pages preview assets without deploying
        run: npm run build
        env:
          MATCHWORK_PAGES: 'true'

      - name: Validate Pages asset paths
        run: node scripts/verifyPagesBuild.mjs

      - name: Enterprise integrity, deterministic resilience, and release audit
        run: node scripts/verifyEnterprise.mjs

      - name: Verify specialist workflow prototype and evidence recovery
        run: node scripts/verifyWorkflow.mjs
